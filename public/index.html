<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>رويال بوكر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#e7b84b;--gold2:#ffe08a;--line:#8a6a2c}
*{box-sizing:border-box;margin:0;font-family:Cairo,Tahoma,sans-serif}
[hidden]{display:none!important}
#net{position:fixed;top:0;left:0;right:0;z-index:99;background:#8a1020;color:#fff;padding:10px 14px;text-align:center;font-weight:800;font-size:.9rem}
body{background:#0e1122;color:#fff;min-height:100dvh}
h1{font-size:2.2rem;color:var(--gold2);text-shadow:0 2px 0 #5a3a00}
.box{max-width:420px;margin:7vh auto 0;padding:26px;background:linear-gradient(#2e2016,#1c130d);border:2px solid var(--line);border-radius:16px;display:grid;gap:12px;box-shadow:0 20px 60px #000b}
label{font-size:.85rem;color:#cdbf94;display:grid;gap:4px}
input{background:#120c08;border:2px solid #5a4128;border-radius:10px;padding:10px 12px;color:#fff;font-size:1rem;width:100%}
input:focus{outline:none;border-color:var(--gold)}
button{font-family:inherit;cursor:pointer}
.btn,.kb{border:2px solid #5a4128;border-radius:12px;padding:11px 14px;font-size:1.05rem;font-weight:800;color:#ffe9b0;background:linear-gradient(#3b2a1c,#21160e);box-shadow:inset 0 1px 0 #ffffff18,0 3px 0 #0009}
.btn:disabled{opacity:.4}
.gold{background:linear-gradient(#ffe08a,#e7b84b 55%,#b9821a);color:#3a2400;border-color:#fff1b8}
.row{display:flex;gap:10px}.row>*{flex:1}
#plist{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:10px;background:#120c08;border:1px solid #5a4128;padding:8px 12px;border-radius:10px}
.pl .mn{margin-inline-start:auto;color:var(--gold2);font-weight:800}
#game{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:linear-gradient(#262e52,#151a30 22%,#151a30 78%,#2a1d11)}
#rug{position:absolute;inset:70px 8px 200px;border-radius:14px;border:3px solid var(--line);box-shadow:inset 0 0 50px #5a431eaa;background:radial-gradient(ellipse at 50% 45%,#dfcd9f,#c6af7e 70%,#a58c5a);overflow:hidden}
#rug::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#8a6a2c26 0 2px,transparent 2px 30px),repeating-linear-gradient(-45deg,#8a6a2c26 0 2px,transparent 2px 30px)}
#table{position:absolute;inset:0 0 194px 0}
.rb{position:absolute;left:10px;width:46px;height:46px;border-radius:50%;border:3px solid #6b4510;background:radial-gradient(#f2c466,#a8741f);font-size:1.2rem;box-shadow:0 3px 6px #000a}
#rules{position:absolute;top:10px;right:10px;z-index:5;width:min(150px,36vw);background:#2e2016ee;border-top:3px solid #a8741f;border-radius:6px;padding:7px 9px;font-size:.8rem;text-align:center;box-shadow:0 4px 12px #000a}
.pill{display:flex;align-items:center;justify-content:space-between;background:#120c08;border-radius:16px;padding:2px 8px;margin:2px 0 5px;font-weight:800;font-size:.95rem}
.pill.w{color:var(--gold2)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(#ffe08a,#c58a1c);color:#5a3a00;font-size:.6rem;display:grid;place-items:center;flex:none}
#mid{position:absolute;left:0;right:0;top:34%;display:grid;justify-items:center;gap:6px;z-index:2}
#board{display:flex;gap:4px}
#pot{display:flex;gap:6px;align-items:center;background:#120ccc;background:#120c08cc;border:1px solid var(--gold);border-radius:16px;padding:2px 12px;color:var(--gold2);font-weight:800;font-size:.9rem}
#msg{max-width:190px;text-align:center;font-size:.8rem;color:#2a1a00;font-weight:800;text-shadow:0 1px 0 #fff6}
.c{width:36px;height:50px;border-radius:5px;background:#fbfaf5;color:#111;display:flex;flex-direction:column;padding:2px 4px;font-weight:800;line-height:1;box-shadow:0 2px 5px #0008}
.c b{font-size:.95rem}.c i{font-style:normal;font-size:1.25rem}
.c.r{color:#c8141e}
svg.c{display:block;padding:0;background:none;box-shadow:0 2px 5px #0008;border-radius:5px;overflow:visible}
.c.b{background:#d9c58f;border:2px solid #f3ead0;background-image:repeating-linear-gradient(45deg,#b8944a 0 2px,transparent 2px 8px),repeating-linear-gradient(-45deg,#b8944a 0 2px,transparent 2px 8px)}
.c.e{background:#0002;border:1px dashed #6b4a1e99;box-shadow:none}
.seat{position:absolute;width:104px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3}
.seat .cards{display:flex;gap:3px}
.seat:not(.me) .c{width:28px;height:40px}.seat:not(.me) .c b{font-size:.8rem}.seat:not(.me) .c i{font-size:.95rem}
.me .c{width:60px;height:84px;filter:drop-shadow(0 0 7px #e040fb)}.me .c b{font-size:1.3rem}.me .c i{font-size:1.9rem}
.me .c:first-child{transform:rotate(-6deg)}.me .c:last-child{transform:rotate(6deg);margin-inline-start:-12px}
.av{position:relative;width:62px;height:62px;border:3px solid #d9a441;display:grid;place-items:center;font-size:1.7rem;font-weight:800;color:var(--gold2);box-shadow:0 2px 8px #000a}
.turn .av{border-color:#ffb347;box-shadow:0 0 0 3px #ff9a2e55,0 0 18px #ff9a2e}
.dl{position:absolute;top:-12px;right:-16px;background:#2fae4d;border:2px solid #9be0a8;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-style:normal;font-size:.65rem;font-weight:800}
.nb{width:100%;display:flex;justify-content:space-between;align-items:center;background:#000c;font-size:.78rem;padding-inline-start:6px}
.nb b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62px}
.lv{background:#1f7f8f;padding:1px 7px;font-style:normal;font-size:.7rem}
.cb{width:100%;display:flex;align-items:center;justify-content:space-between;background:#000b;border-radius:6px;padding:1px 6px;font-weight:800;font-size:.95rem}
.pc{position:relative;width:100%;height:13px;background:#555;border-radius:7px;overflow:hidden;font-size:.7rem;text-align:center;line-height:13px;font-weight:800}
.pc u{position:absolute;top:0;bottom:0;right:0;background:#f07a1a}.pc span{position:relative}
.tb{width:100%;height:4px;background:#0008;border-radius:2px;overflow:hidden}.tb i{display:block;height:100%;background:#ffb347}
.seat.out{opacity:.45}.seat.won .av{border-color:#fff;box-shadow:0 0 22px var(--gold2)}
.tags{display:flex;gap:4px;font-size:.7rem;font-weight:800;flex-wrap:wrap;justify-content:center}.tags span{background:#222a38;padding:0 7px;border-radius:8px}
.tags .ai{background:#8a1020}.tags .w{background:var(--gold);color:#000}.hn{font-size:.72rem;color:var(--gold2);font-weight:800}
.bet{position:absolute;transform:translate(-50%,-50%);z-index:4;display:flex;gap:4px;align-items:center;background:#000b;border:1px solid var(--gold);border-radius:12px;padding:1px 8px 1px 4px;font-size:.75rem;font-weight:800;color:var(--gold2)}
#bar{position:absolute;inset:auto 0 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#2a1d12,#150e09);border-top:3px solid var(--line);display:grid;gap:8px}
#hp{justify-self:end;display:flex;align-items:center;gap:8px;min-width:130px;min-height:34px;background:#120c08;border:2px solid #d9a441;border-radius:20px;padding:0 6px 0 14px;color:var(--gold2);font-weight:800;box-shadow:0 0 10px #d9a44166;margin-top:-34px;position:relative}
#hp::after{content:"i";width:22px;height:22px;border-radius:50%;background:#d9a441;color:#2a1a00;display:grid;place-items:center;font-weight:800;margin-inline-start:auto}
#rg{display:grid;gap:6px;visibility:hidden}.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pre button{background:#2e2016;border:1px solid #8a6a2c;border-radius:8px;color:#ffe9b0;padding:7px 2px;font-size:.8rem;font-weight:800}.rr{display:flex;gap:8px;align-items:center}#bar.on #rg.can{visibility:visible}
#rg input[type=range]{accent-color:var(--gold);padding:0;border:0;flex:1}#rv{width:90px;text-align:center;padding:6px}
.keys{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.kb{color:#8d7550;padding:12px 4px}
#bar.on .kb{color:#ffe9b0;border-color:#a8741f}
#bar.on #fold{background:linear-gradient(#7a1d2a,#4a0e18)}#bar.on #call{background:linear-gradient(#2f8a58,#17583a)}#bar.on #raise{background:linear-gradient(#34508a,#1c2f58)}
#allin{background:linear-gradient(#ffe08a,#e7b84b 55%,#b9821a);color:#3a2400;border-color:#fff1b8;opacity:.55;font-size:1.25rem}
#bar.on #allin{opacity:1;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 1px 0 #fff9,0 0 24px var(--gold2),0 3px 0 #0009}}
@media(prefers-reduced-motion:reduce){#bar.on #allin{animation:none}}
</style></head><body>
<div id="net" hidden></div><div id="home" class="box"><h1 id="ttl">رويال بوكر</h1><div id="mt" hidden style="background:#8a1020;border-radius:10px;padding:8px;text-align:center;font-weight:800"></div>
<label>اسمك<input id="nm" maxlength="14" placeholder="مثال: أبو فهد"></label>
<div id="cf" style="display:grid;gap:12px"><label>تذكرة الدخول (رصيد كل لاعب)<input id="ch" type="number" value="10000" min="20"></label><label>الفوز (يفوز أول من يوصل له)<input id="wn" type="number" value="30000"></label>
<button id="create" class="btn gold">إنشاء طاولة جديدة</button><div style="color:#cdbf94;text-align:center;font-size:.85rem">— أو ادخل طاولة موجودة —</div></div>
<label>كود الطاولة<input id="code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"></label>
<button id="join" class="btn">دخول الطاولة</button></div>

<div id="lobby" class="box" hidden><h1>الطاولة <span id="lc"></span></h1>
<label>رابط الدعوة<div class="row"><input id="link" readonly><button id="copy" class="btn gold" style="flex:none">نسخ</button></div></label>
<div id="lt" style="color:var(--gold2);font-weight:800"></div><div id="plist"></div><div id="lmsg" style="color:#cdbf94;font-size:.9rem"></div>
<button id="start" class="btn gold" hidden>ابدأ اللعب</button></div>

<div id="game" hidden><div id="rug"></div>
<button class="rb" id="bl" style="top:10px" aria-label="نسخ رابط الدعوة">🔗</button><button class="rb" id="bx" style="top:64px" aria-label="خروج">🚪</button>
<div id="rules"></div>
<div id="table"><div id="mid"><div id="pot"></div><div id="board"></div><div id="msg"></div></div><div id="seats"></div></div>
<div id="bar"><div id="hp" hidden></div>
<div id="rg"><div class="pre"><button data-p="min">الأدنى</button><button data-p=".5">½ البوت</button><button data-p="1">البوت</button><button data-p="max">الأقصى</button></div><div class="rr"><input id="rs" type="range"><button id="raise" class="kb"></button></div></div>
<div class="keys"><button id="call" class="kb">مساومة</button><button id="allin" class="kb">كل شي</button><button id="fold" class="kb">انسحب</button></div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id),sock=typeof io==='undefined'?{on(){},emit(){},connected:false}:io(),S=['♠','♥','♦','♣'],R={11:'J',12:'Q',13:'K',14:'A'};
let st=null,dl=0,mine=false;
const fmt=n=>Number(n).toLocaleString('en'),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SC=['#111','#c8141e','#c8141e','#111'],LBL={14:'A',13:'K',12:'Q',11:'J'};
const PIPS={7:[[21,22],[39,22],[21,42],[39,42],[21,62],[39,62],[30,32]],8:[[21,22],[39,22],[21,42],[39,42],[21,62],[39,62],[30,32],[30,52]],
 9:[[21,21],[39,21],[21,35],[39,35],[21,49],[39,49],[21,63],[39,63],[30,42]],10:[[21,21],[39,21],[21,35],[39,35],[21,49],[39,49],[21,63],[39,63],[30,28],[30,56]]};
const ROBE={13:'#c8141e',12:'#1f3a93',11:'#d9a21b'};
function court(r,col){
 const robe=ROBE[r],hat=r===13?`<path d="M25 20 L26 13.5 L28.5 17.5 L30 12.5 L31.5 17.5 L34 13.5 L35 20Z" fill="#e8b830" stroke="#5a3a00" stroke-width=".5"/>`:
  r===12?`<path d="M25 20 L26 15 L28.5 18 L30 14 L31.5 18 L34 15 L35 20Z" fill="#e8b830" stroke="#5a3a00" stroke-width=".5"/><circle cx="30" cy="12.5" r="1.8" fill="#c8141e"/>`:
  `<path d="M24.5 21 Q30 10 36 21Z" fill="#1f3a93" stroke="#111" stroke-width=".5"/><path d="M33 14 Q40 9 41 17" fill="none" stroke="#c8141e" stroke-width="1.4"/>`;
 const half=`<path d="M18 42 L22 31 Q30 26 38 31 L42 42Z" fill="${robe}" stroke="#222" stroke-width=".5"/><path d="M30 28 L30 42" stroke="#fff8" stroke-width="1"/><circle cx="30" cy="24" r="5" fill="#f2c9a0" stroke="#333" stroke-width=".5"/>${hat}`;
 return `<rect x="17" y="13" width="26" height="58" rx="2" fill="#fff4d6" stroke="${col}" stroke-width="1"/><g>${half}</g><g transform="rotate(180 30 42)">${half}</g><line x1="17" y1="42" x2="43" y2="42" stroke="${col}" stroke-width=".6"/>`}
const card=c=>{
 if(c===0)return'<div class="c b"></div>';
 const col=SC[c.s],su=S[c.s],lb=LBL[c.r]||c.r,fs=lb==='10'?12:15;
 const idx=`<text x="9" y="16" font-size="${fs}" font-weight="800" fill="${col}" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif">${lb}</text><text x="9" y="29" font-size="12" fill="${col}" text-anchor="middle" dominant-baseline="central">${su}</text>`;
 let body;
 if(c.r===14)body=`<text x="30" y="43" font-size="38" fill="${col}" text-anchor="middle" dominant-baseline="central">${su}</text>`;
 else if(PIPS[c.r])body=PIPS[c.r].map(([x,y])=>`<text x="${x}" y="${y}" font-size="12" fill="${col}" text-anchor="middle" dominant-baseline="central"${y>42?` transform="rotate(180 ${x} ${y})"`:''}>${su}</text>`).join('');
 else body=court(c.r,col);
 return `<svg class="c cd" viewBox="0 0 60 84" xmlns="http://www.w3.org/2000/svg"><rect x=".5" y=".5" width="59" height="83" rx="5" fill="#fbfaf5" stroke="#bdb59c" stroke-width="1"/>${idx}<g transform="rotate(180 30 42)">${idx}</g>${body}</svg>`};
const coin='<span class="coin">♣</span>',hue=t=>[...t].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let pid=ls.get('rp_pid');if(!pid){pid=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)+Math.random().toString(36).slice(2));ls.set('rp_pid',pid)}
const m=location.pathname.match(/^\/r\/(\w+)/);if(m){$('code').value=m[1].toUpperCase();$('cf').hidden=true}
$('nm').value=ls.get('rp_name')||'';let joined=false;
const doJoin=()=>{if(!sock.connected)return net(OFF);const name=$('nm').value.trim();ls.set('rp_name',name);sock.emit('join',{name,code:$('code').value.trim(),pid})};
$('join').onclick=doJoin;
$('create').onclick=()=>{if(!sock.connected)return net(OFF);const name=$('nm').value.trim();ls.set('rp_name',name);sock.emit('create',{name,ticket:+$('ch').value,win:+$('wn').value,pid})};
$('start').onclick=()=>sock.emit('start');
const cp=b=>{navigator.clipboard.writeText($('link').value);b.textContent='تم النسخ'};
$('copy').onclick=()=>cp($('copy'));$('bl').onclick=()=>{navigator.clipboard.writeText(location.href);$('bl').textContent='✓'};
$('bx').onclick=()=>{ls.del('rp_room');location.href='/'};
const act=(type,amount)=>{if(mine)sock.emit('act',{type,amount})};
$('fold').onclick=()=>act('fold');$('allin').onclick=()=>act('allin');
const setR=v=>{v=Math.max(+$('rs').min,Math.min(+$('rs').max,Math.round(v)));$('rs').value=v;$('raise').textContent='رفع إلى '+fmt(v)};$('rs').oninput=()=>setR(+$('rs').value);
document.querySelectorAll('.pre button').forEach(b=>b.onclick=()=>{const p=b.dataset.p,mn=+$('rs').min,mx=+$('rs').max;setR(p==='min'?mn:p==='max'?mx:st.cur+st.pot*p)});
$('raise').onclick=()=>act('raise',+$('rs').value);
fetch('/config.json').then(r=>r.json()).then(c=>{
 document.title=c.title;$('ttl').textContent=c.title;
 document.documentElement.style.setProperty('--gold',c.accent);
 if(!m){$('ch').value=c.defaultTicket;$('wn').value=Math.floor(c.defaultTicket*c.winMult);$('ch').min=c.minTicket;
  $('ch').oninput=()=>{$('wn').value=Math.floor(+$('ch').value*c.winMult)}}
 if(!c.allowWebCreate){$('cf').hidden=true}
 if(c.maintenance){$('mt').textContent=c.maintenanceMsg;$('mt').hidden=false}
}).catch(()=>{});
const net=m=>{$('net').textContent=m;$('net').hidden=false};
const OFF='ما قدرت أتصل بالسيرفر. تأكد إن السيرفر شغّال وافتح الموقع من الرابط (مو من الملف مباشرة).';
if(typeof io==='undefined')net(OFF);
sock.on('connect',()=>{$('net').hidden=true;const rc=m&&m[1].toUpperCase(),n=ls.get('rp_name');if(joined||(rc&&ls.get('rp_room')===rc&&n))sock.emit('join',{name:n||$('nm').value.trim(),code:rc||$('code').value.trim(),pid})});
sock.on('closed',t=>{joined=false;ls.del('rp_room');net(t);setTimeout(()=>{location.href='/'},2500)});sock.on('connect_error',()=>net(OFF));
sock.on('err',t=>{if(/غير موجودة|بدأت/.test(t)){joined=false;ls.del('rp_room')}net(t);setTimeout(()=>$('net').hidden=true,4500)});
sock.on('state',s=>{st=s;joined=true;ls.set('rp_room',s.code);dl=Date.now()+s.left;if(!location.pathname.startsWith('/r/'))history.replaceState(0,'','/r/'+s.code);render()});
setInterval(()=>document.querySelectorAll('.tb i').forEach(e=>e.style.width=Math.max(0,dl-Date.now())/100+'%'),100);
function render(){
 $('home').hidden=true;const lobby=st.phase==='lobby';$('lobby').hidden=!lobby;$('game').hidden=lobby;
 const me=st.players.find(p=>p.id===st.me);
 if(lobby){$('lc').textContent=st.code;$('lt').textContent='تذكرة الدخول '+fmt(st.ticket)+' • الفوز '+fmt(st.win);$('link').value=location.origin+'/r/'+st.code;
  $('plist').innerHTML=st.players.map(p=>`<div class="pl"><span class="av" style="width:36px;height:36px;font-size:1.1rem;background:hsl(${hue(p.name)},35%,20%)">${esc([...p.name][0])}</span>${esc(p.name)}${p.id===st.host?' 👑':''}<span class="mn">${fmt(p.chips)}</span></div>`).join('');
  const cnt=st.players.filter(p=>p.chips>0).length,ok=cnt>=st.minp,isH=!!st.host&&st.host===st.me;
  $('lmsg').textContent=st.msg||(ok?(isH?'جاهزين — اضغط ابدأ اللعب':(st.host?'جاهزين — بانتظار المنظّم يبدأ اللعبة':'جاهزين — بانتظار المنظّم'+(st.by?' ('+st.by+')':'')+' يبدأ اللعبة من ديسكورد')):'نحتاج '+st.minp+' لاعبين على الأقل ('+cnt+'/'+st.minp+') — أرسل الرابط لخواتك');
  $('start').hidden=!isH;$('start').style.opacity=ok?1:.6;return}
 const n=st.players.length,mi=st.players.indexOf(me);let h='';
 st.players.forEach((p,i)=>{const k=(i-mi+n)%n,a=Math.PI/2+k*2*Math.PI/n,x=50+36*Math.cos(a),y=k?52+33*Math.sin(a):98,t=p.id===st.turn,pc=Math.min(100,Math.round(p.chips/st.win*100));
  const cards=`<div class="cards">${p.hand.map(card).join('')}</div>`;
  h+=`<div class="seat ${k?'':'me'} ${t?'turn':''} ${p.folded||!p.in?'out':''} ${p.win?'won':''}" style="left:${x}%;top:${y}%;transform:translate(-50%,${k?'-50%':'-100%'})">
  ${k?'':cards}<div class="av" style="background:hsl(${hue(p.name)},35%,16%)">${esc([...p.name][0])}${p.dealer?'<em class="dl">موزع</em>':''}</div>
  <div class="nb"><b>${esc(p.name)}</b><i class="lv">${i+1}</i></div><div class="cb">${fmt(p.chips)}${coin}</div>
  <div class="pc"><u style="width:${pc}%"></u><span>${pc}%</span></div>${t?'<div class="tb"><i></i></div>':''}
  ${p.hn?`<div class="hn">${p.hn}</div>`:''}<div class="tags">${p.allin?'<span class="ai">كل شي</span>':''}${p.folded?'<span>انسحب</span>':''}${p.win?`<span class="w">+${fmt(p.win)}</span>`:''}</div>${k?cards:''}</div>`;
  if(p.bet)h+=`<div class="bet" style="left:${50+(x-50)*.55}%;top:${50+((k?y:80)-50)*.55}%">${coin}${fmt(p.bet)}</div>`});
 $('seats').innerHTML=h;
 $('board').innerHTML=[0,1,2,3,4].map(i=>st.board[i]?card(st.board[i]):'<div class="c e"></div>').join('');
 $('pot').innerHTML=coin+'البوت '+fmt(st.pot);$('msg').textContent=st.msg;
 $('rules').innerHTML=`تذكرة الدخول<div class="pill">${fmt(st.ticket)}${coin}</div>الفوز<div class="pill w">${fmt(st.win)}${coin}</div><span style="color:#cdbf94">طاولة ${st.code}</span>${st.rk&&st.rk.length?`<div style="color:#cdbf94;margin-top:3px;font-size:.72rem">الورق: ${st.rk.map(r=>R[r]||r).join(' ')}</div>`:''}`;
 $('hp').hidden=!st.mh;$('hp').firstChild&&0;$('hp').textContent=st.mh||'';
 mine=st.turn===st.me&&!!me;$('bar').className=mine?'on':'';
 if(!mine){$('rg').className='';$('call').textContent='مساومة';return}
 const to=st.cur-me.bet,mx=me.chips+me.bet,mn=Math.min(st.cur+Math.max(st.minRaise,st.bb),mx);
 $('call').textContent=to>0?'مساومة '+fmt(Math.min(to,me.chips)):'تمرير';
 $('call').onclick=()=>act(to>0?'call':'check');
 $('rg').className=mx>st.cur?'can':'';
 $('rs').min=mn;$('rs').max=mx;$('rs').step=1;setR(mn)}
</script></body></html>
